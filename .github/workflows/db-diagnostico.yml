name: DB Diagnóstico (egress)

# Mostra que consultas estão a ler mais linhas da base, a partir do
# pg_stat_statements. O egress do Supabase conta bytes que saem pela rede, e
# linhas devolvidas são a melhor aproximação disponível.
#
# Existe porque a ligação direta à base a partir de uma máquina de
# desenvolvimento pode ficar bloqueada pelo pooler (ban por tentativas
# falhadas), e o CI continua a chegar lá. O repo é público: só se imprimem as
# consultas normalizadas ($1, $2...), nunca valores.

on:
  workflow_dispatch:
    inputs:
      reset:
        description: "Zerar o contador no fim (para medir uma janela limpa)"
        type: boolean
        default: false
      identidades:
        description: "Correr as verificações de identidades contabilísticas"
        type: boolean
        default: false
      ticker:
        description: "Mostrar os segmentos de receita desta empresa (opcional)"
        required: false
        default: ""
      pagantes:
        description: "Verificar os pagantes (Whop → plano PRO), sem emails"
        type: boolean
        default: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Top consultas por linhas devolvidas
        env:
          DB: ${{ secrets.DIRECT_URL }}
        run: |
          psql "$DB" -P pager=off -c "select stats_reset as contagem_desde, now() as agora from pg_stat_statements_info;"
          psql "$DB" -P pager=off -c "
            select calls, rows, round(rows::numeric/greatest(calls,1)) as linhas_por_call,
                   left(regexp_replace(query, '\s+', ' ', 'g'), 150) as consulta
            from pg_stat_statements
            where query not ilike '%pg_stat%' and rows > 0
            order by rows desc limit 25;"
      - name: Zerar contador
        if: ${{ github.event.inputs.reset == 'true' }}
        env:
          DB: ${{ secrets.DIRECT_URL }}
        run: psql "$DB" -c "select pg_stat_statements_reset();"
      - name: Cobertura dos fundamentais (só contagens)
        env:
          DB: ${{ secrets.DIRECT_URL }}
        run: |
          psql "$DB" -P pager=off -c "
            select count(*) as linhas,
                   count(distinct \"companyId\") as empresas,
                   count(*) filter (where source = 'fmp') as fmp,
                   count(*) filter (where \"revenueSegments\" is not null) as com_segmentos,
                   count(*) filter (where \"revenueSegmentsByAxis\" is not null) as com_segmentos_eixo,
                   count(*) filter (where \"businessKpis\" is not null) as com_kpis
            from fundamentals;"
      - name: Segmentos por período
        if: ${{ github.event.inputs.ticker != '' }}
        env:
          DB: ${{ secrets.DIRECT_URL }}
          TICKER: ${{ github.event.inputs.ticker }}
        run: |
          psql "$DB" -P pager=off -v t="$TICKER" <<'SQL'
            select f."periodType" as tipo, f."fiscalYear" as ano, f."fiscalQuarter" as tri,
                   round(f."totalEquity"/1e9, 2) as capital_proprio_mm, f."returnOnEquity" as roe,
                   (select string_agg(k, ' | ' order by k) from jsonb_object_keys(f."revenueSegments"::jsonb) k) as segmentos
            from fundamentals f join companies c on c.id = f."companyId"
            where c.ticker = :'t'
            order by f."periodEnd";
          SQL
      - uses: actions/checkout@v4
        if: ${{ github.event.inputs.identidades == 'true' }}
      - name: Identidades contabilísticas
        if: ${{ github.event.inputs.identidades == 'true' }}
        env:
          DB: ${{ secrets.DIRECT_URL }}
        run: psql "$DB" -v ON_ERROR_STOP=1 -f scripts/sql/identidades.sql

      # Só leitura e sem dados pessoais (o repo do espelho é público): cada
      # conta aparece pelos 6 primeiros caracteres do id. Responde a "quem
      # pagou ficou PRO?" — a falha que interessa é um pagamento Whop válido
      # sem conta PRO (pendente por resgatar, ou estado ativo com plano FREE).
      - name: Pagantes (Whop → PRO)
        if: ${{ github.event.inputs.pagantes == 'true' }}
        env:
          DB: ${{ secrets.DIRECT_URL }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
            \echo '== Contas PRO ou com dados Whop (mais recentes primeiro)'
            select left(u.id, 6) as conta, u.plan, u."whopStatus" as estado_whop,
                   (u."whopMembershipId" is not null) as membership_whop,
                   (u."paddleSubscriptionId" is not null) as paddle,
                   (a.email_confirmed_at is not null) as email_confirmado,
                   a.last_sign_in_at::timestamp(0) as ultimo_login,
                   u."createdAt"::timestamp(0) as criada, u."updatedAt"::timestamp(0) as alterada
              from public.users u left join auth.users a on a.id::text = u.id
             where u.plan = 'PRO' or u."whopMembershipId" is not null or u."whopStatus" is not null
             order by u."updatedAt" desc;
            \echo '== Pagamentos Whop à espera de conta (pendentes)'
            select left(id, 6) as linha, status, (email is not null) as tem_email,
                   ("claimedAt" is not null) as resgatado,
                   "createdAt"::timestamp(0) as recebido, "updatedAt"::timestamp(0) as alterado
              from whop_pending_memberships
             order by "updatedAt" desc limit 30;
            \echo '== Problemas (devia ser tudo 0)'
            select
              (select count(*) from whop_pending_memberships
                where "claimedAt" is null and status in ('active','trialing','completed','past_due'))
                as pago_sem_conta,
              (select count(*) from public.users
                where plan = 'FREE' and "whopStatus" in ('active','trialing','completed','past_due'))
                as whop_ativo_mas_free,
              (select count(*) from public.users u join auth.users a on a.id::text = u.id
                where u.plan = 'PRO' and a.email_confirmed_at is null)
                as pro_sem_email_confirmado;
            \echo '== Registos por dia (14 dias): se ninguém confirma, os emails de confirmação não estão a chegar'
            select created_at::date as dia, count(*) as registos,
                   count(*) filter (where email_confirmed_at is not null) as confirmados,
                   count(*) filter (where last_sign_in_at is not null) as com_login,
                   max(confirmation_sent_at)::timestamp(0) as ultimo_email_enviado
              from auth.users where created_at > now() - interval '14 days'
             group by 1 order by 1 desc;
          SQL

