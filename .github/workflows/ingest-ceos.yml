name: Ingest CEOs (Daily)

on:
  schedule:
    # Diário às 02:00.
    #
    # Era mensal, no dia 1. A 1 de setembro de 2026 a corrida gravou o Tim
    # Cook como CEO da Apple; dias depois ele passou a Executive Chairman e o
    # John Ternus a CEO, e a plataforma continuou a dizer Tim Cook — na
    # empresa mais vista de todas, que é também o ticker da demo pública, o
    # único que quem não tem conta consegue abrir. Só mudaria a 1 de outubro.
    #
    # Uma mudança de CEO é rara mas é notícia, e é exactamente quando alguém
    # vai confirmar à plataforma. A corrida leva 9 minutos e o repositório é
    # público, portanto os minutos do GitHub Actions são grátis: não há razão
    # nenhuma para esperar um mês.
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run ingest_ceos.py
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python scripts/ingest_ceos.py
