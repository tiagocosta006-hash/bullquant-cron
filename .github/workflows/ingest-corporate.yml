name: Ingest Corporate Events

on:
  workflow_dispatch:
  # SEM agendamento: o /stock/dividend e o /stock/split do Finnhub devolvem
  # 403 no plano gratuito, portanto esta ingestão não tem nada para trazer.
  # Corria todos os dias a fazer 1.118 chamadas (duas por empresa) que eram
  # todas rejeitadas — contra a mesma quota de 60/minuto de que dependem as
  # cotações ao vivo — e terminava em sucesso, com a tabela corporate_events
  # a zero linhas desde sempre.
  #
  # Fica acionável à mão: no dia em que houver plano pago, basta correr. O
  # script sonda o acesso antes de percorrer as empresas e diz porque para.

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run ingest
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/ingest_corporate_events.py
