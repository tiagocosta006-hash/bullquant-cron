name: Ingest Fundamentals

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # diário 3h UTC

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run ingest
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python scripts/ingest_fundamentals.py

      # A re-ingestão repõe o histórico de shares na base pré-split do EDGAR
      # (só reapresenta 2-3 anos comparativos) — ajustar sempre a seguir.
      - name: Adjust historical stock splits
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python scripts/adjust_splits.py

      # Gate de IDENTIDADES CONTABILÍSTICAS, aqui e não só no validate-database
      # semanal: uma ingestão má ficava até 7 dias a apodrecer antes de alguém
      # saber. Valida o que ACABOU de ser escrito, no momento em que ainda se
      # sabe o que mudou. Compara com scripts/out/validator_baseline.json e só
      # falha com violações NOVAS, portanto a dívida conhecida não bloqueia.
      - name: Accounting identities gate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python scripts/validate_fundamentals.py
