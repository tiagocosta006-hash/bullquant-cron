name: Ingest Fundamentals

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Lista separada por vírgulas. Vazio = seleção event-driven normal."
        required: false
        default: ""
      refresh_cache:
        description: "Ir à SEC em vez de usar a cache local (mais lento, traz filings novas)"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 3 * * *" # diário 3h UTC

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # A seleção normal é event-driven: só toca em quem reportou há pouco ou
      # não é atualizado há mais de 95 dias. Isso é o correto no dia a dia, mas
      # não repara histórico — uma linha de 2016 com um defeito de extração
      # nunca mais é revisitada. Os inputs existem para essas reparações.
      - name: Run ingest
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          TICKERS: ${{ github.event.inputs.tickers }}
          REFRESH: ${{ github.event.inputs.refresh_cache }}
        run: |
          ARGS=""
          [ -n "$TICKERS" ] && ARGS="$ARGS --tickers $TICKERS"
          [ "$REFRESH" = "true" ] && ARGS="$ARGS --refresh-cache"
          echo "ingest_fundamentals.py$ARGS"
          python scripts/ingest_fundamentals.py $ARGS

      # A re-ingestão repõe o histórico de shares na base pré-split do EDGAR
      # (só reapresenta 2-3 anos comparativos) — ajustar sempre a seguir.
      - name: Adjust historical stock splits
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python scripts/adjust_splits.py

      # A API companyfacts descarta factos dimensionados, e empresas de classes
      # múltiplas passam a publicar as ações SÓ por classe — a partir daí o
      # companyfacts fica sem nada. Este script vai buscá-las ao XBRL do filing,
      # que as tem, e trata a regra das classes (na Berkshire fica o maior, que
      # é o equivalente em classe B; na Alphabet soma A+B+C). Valida cada valor
      # contra `EPS × ações ≈ resultado líquido` e não escreve o que falhar.
      #
      # Existia no repositório e NUNCA correu, por não estar em workflow nenhum:
      # a Visa e a Berkshire estavam sem uma única linha de ações em 52
      # períodos, e com elas sem capitalização, sem P/E e sem múltiplos.
      #
      # Antes do passo do Finnhub, de propósito: esta fonte traz HISTÓRICO, a
      # outra só o número de hoje.
      - name: Fill missing shares from XBRL
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SEC_IDENTITY: ${{ secrets.SEC_IDENTITY }}
        run: python scripts/fill_missing_shares.py --apply

      # A API companyfacts da SEC descarta factos dimensionados, e empresas de
      # classes múltiplas (Visa A/B/C, Constellation A/B) taggam as ações por
      # classe — ficam sem nº de ações NENHUM, logo sem capitalização, logo no
      # fundo da lista de maiores empresas. Preenche com o Finnhub, validando
      # a unidade contra a capitalização que o próprio Finnhub declara.
      # Depois da re-ingestão, que apaga e reescreve as linhas da empresa.
      - name: Backfill shares outstanding (multi-class)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/backfill_shares.py

      # Gate de IDENTIDADES CONTABILÍSTICAS, aqui e não só no validate-database
      # semanal: uma ingestão má ficava até 7 dias a apodrecer antes de alguém
      # saber. Valida o que ACABOU de ser escrito, no momento em que ainda se
      # sabe o que mudou. Compara com scripts/out/validator_baseline.json e só
      # falha com violações NOVAS, portanto a dívida conhecida não bloqueia.
      - name: Accounting identities gate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python scripts/validate_fundamentals.py
