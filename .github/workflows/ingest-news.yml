name: Ingest News

on:
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Nº máximo de artigos a gerar"
        required: false
        default: "4"
  schedule:
    # De 6 em 6 horas, e não de hora a hora, porque o orçamento é de PEDIDOS.
    #
    # O nível gratuito do Gemini dá 20 pedidos/dia ao projeto inteiro (medido
    # no AI Studio a 2026-09-20: RPM 5, TPM 250K, RPD 20). Cada corrida gasta
    # 1 pedido de triagem + 1 por artigo, portanto:
    #
    #     4 corridas x (1 triagem + 4 artigos) = 20 pedidos/dia
    #
    # De hora a hora eram 24 triagens antes de se escrever um único artigo — o
    # orçamento acabava sem nunca chegar à parte que produz notícias.
    - cron: "0 5,11,17,23 * * *"

# Uma execução de cada vez — duas em paralelo criariam clusters duplicados
# para a mesma história.
concurrency:
  group: ingest-news
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ingest
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          # Conta Gemini própria do terminal (fallback para a partilhada).
          NEWS_GEMINI_API_KEY: ${{ secrets.NEWS_GEMINI_API_KEY }}
          NEWS_GEMINI_MODEL: ${{ secrets.NEWS_GEMINI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Notificação de aprovação no Discord. Se faltarem, o artigo fica na
          # mesma em DRAFT e aprova-se em /admin/news.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_REVIEW_CHANNEL_ID: ${{ secrets.DISCORD_REVIEW_CHANNEL_ID }}
          DISCORD_ADMIN_USER_IDS: ${{ secrets.DISCORD_ADMIN_USER_IDS }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npx tsx scripts/ingest_news.ts --max=${{ github.event.inputs.max_articles || '4' }}
