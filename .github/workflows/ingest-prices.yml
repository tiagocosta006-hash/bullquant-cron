name: Ingest Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 1-5" # dias de semana 23h UTC (pós-fecho US)

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # A Polygon é a fonte preferida (CLAUDE.md §5) e é ela que corre
      # primeiro.
      #
      # ── Uma correcção a mim próprio ────────────────────────────────────
      #
      # Isto chegou a estar ao contrário. Eu concluí que o `POLYGON_API_KEY`
      # estava vazio e que este cron "falhava todos os dias, desde sempre",
      # e pus o yfinance como fonte principal. Estava errado: o histórico das
      # corridas mostra a chave presente e a Polygon a ingerir — a de 10 de
      # setembro de 2026 terminou com "542 atualizados, 0 já ok, 17 erros",
      # depois de 43 minutos a percorrer as 559 empresas.
      #
      # A chave que eu vi vazia era a do ambiente local, não a dos secrets do
      # GitHub. E o atraso dos preços que me levou a essa conclusão tinha
      # outra causa, que só apareceu depois: desde 10 de setembro o GitHub
      # Actions está bloqueado por faturação e NENHUM workflow chega a
      # arrancar.
      #
      # Pôr o yfinance como principal era ainda pior do que redundante: o
      # CLAUDE.md §9 proíbe-o por uso comercial (ToS do Yahoo), com uma única
      # excepção documentada, que é o nome do CEO.
      - name: Run ingest (Polygon)
        id: polygon
        continue-on-error: true
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          if [ -z "$POLYGON_API_KEY" ]; then
            echo "POLYGON_API_KEY vazia."
            exit 1
          fi
          python scripts/ingest_prices.py

      # Só se a Polygon não correr. O que se aproveita da minha passagem
      # anterior é isto: antes, sem chave ou com a Polygon em baixo, o cron
      # limitava-se a falhar e os preços envelheciam em silêncio.
      #
      # O fast_prices.py traz três salvaguardas que o histórico deste
      # repositório justificou: exclui a Euronext (sem sufixo de bolsa o
      # ticker nu resolve para a empresa errada — MC devolvia a Moelis em vez
      # da LVMH), agrupa por ticker ao calcular a data de início (senão os
      # tickers atrasados nunca eram apanhados) e mapeia os pontos das classes
      # de ações para hífen (BRK.B → BRK-B).
      - name: Run ingest (yfinance, só se a Polygon falhar)
        if: steps.polygon.outcome == 'failure'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          echo "A Polygon não ingeriu. A usar o yfinance como recurso para os"
          echo "preços não ficarem parados — ver CLAUDE.md §9 sobre os ToS."
          python scripts/fast_prices.py

      # Gate de QUALIDADE DOS PREÇOS. O script existia no repo desde sempre e
      # nunca corria — abre com "a tabela tem 2 058 782 linhas e NUNCA foi
      # validada". A regra SALTO_ABSURDO apanha no próprio dia o preço da
      # empresa errada (um ticker europeu sem sufixo resolve para uma empresa
      # americana e cai 90% de um dia para o outro) e a SERIE_DESATUALIZADA
      # apanha o cron parado, que de outra forma só se nota quando um
      # utilizador repara. Só falha com achados NOVOS vs a baseline.
      - name: Price quality gate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: python scripts/validate_prices.py
