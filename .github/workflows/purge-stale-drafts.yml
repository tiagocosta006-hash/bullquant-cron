name: Purge Stale Drafts

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Idade (dias) a partir da qual um rascunho é purgado"
        required: false
        default: "2"
      dry_run:
        description: "Só listar, não escrever"
        type: boolean
        required: false
        default: false
      hard:
        description: "Apagar a linha em vez de arquivar (irreversível)"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "30 4 * * *" # diário 4h30 UTC, antes do movimento da manhã

# Uma de cada vez — duas em paralelo competiriam pelas mesmas linhas.
concurrency:
  group: purge-stale-drafts
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run purge
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: >-
          npx tsx scripts/purge_stale_drafts.ts
          --days=${{ github.event.inputs.days || '2' }}
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          ${{ github.event.inputs.hard == 'true' && '--hard' || '' }}
