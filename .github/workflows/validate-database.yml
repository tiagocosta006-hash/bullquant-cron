name: Validate Database Health

on:
  schedule:
    # Corre todos os Domingos às 06:00 UTC (depois da ingestão)
    - cron: '0 6 * * 0'
  workflow_dispatch: # Permite correr manualmente no GitHub

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Database Validation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx prisma generate
          npx tsx scripts/validate_database.ts

      # Gate de IDENTIDADE DE PERÍODO FISCAL: falha o workflow se reaparecer
      # alguma linha cujo (fiscalYear, fiscalQuarter) não bate com a periodEnd
      # (o bug de confiar nos campos fy/fp da SEC). Exceções legítimas (mudanças
      # de ano fiscal: GPN, LHX) estão em scripts/period_identity_accepted.json.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Period identity gate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          pip install psycopg2-binary python-dotenv
          python scripts/validate_period_identity.py

      # Gate de QUALIDADE DE SEGMENTOS DE RECEITA. Corre DEPOIS do gate de
      # identidade de período, de propósito: os segmentos são reatados por
      # (periodType, periodEnd) após o wipe noturno, logo problemas de rotulagem
      # fiscal contaminam o diagnóstico de segmentos e têm de ser resolvidos
      # primeiro. Só faz SELECT. Falha apenas com achados P0 NOVOS vs a baseline
      # do MESMO host (scripts/out/segment_baseline.<host>.json) — exceções
      # revistas vão para scripts/segments_accepted.json com racional.
      - name: Segment quality gate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          python scripts/validate_segments.py \
            --report segments_health_report.md \
            --csv scripts/out/segment_findings.csv \
            --profile --sdqi-append

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-health-report
          path: |
            database_health_report.md
            segments_health_report.md
            scripts/out/segment_findings.csv
            scripts/out/segment_findings.json
            scripts/out/segment_company_profile.csv
            scripts/out/segment_sdqi_history.csv
          if-no-files-found: warn
